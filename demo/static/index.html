<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trust Aware Topological Linearization</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="tab-algo">
<div class="app" id="app">

  <header class="hdr">
    <h1><span class="t-long">Trust Aware Topological Linearization</span><span class="t-short">TATL Demo</span></h1>
    <div class="tabs-main" role="tablist" aria-label="Demo sections">
      <button type="button" role="tab" class="tabm on" id="tab-algo" data-tab="algo" aria-selected="true" aria-controls="stage">1. Algorithm</button>
      <button type="button" role="tab" class="tabm" id="tab-lab" data-tab="lab" aria-selected="false" aria-controls="stage" tabindex="-1">2. Attack lab</button>
    </div>
    <div class="cfg" role="group" aria-label="Scenario">
      <label class="fld">Team
        <select id="sel-manifest" aria-label="Agent team (manifest)"></select>
      </label>
      <label class="fld">Budget B
        <input id="rng-budget" type="range" min="3" max="15" step="1" value="10" aria-label="Guard budget">
        <output id="out-budget" for="rng-budget">10</output>
      </label>
      <div class="seg" role="radiogroup" aria-label="Allocation">
        <button type="button" class="seg-btn" id="alloc-uniform" role="radio" aria-checked="false">Equal split</button>
        <button type="button" class="seg-btn on" id="alloc-risk" role="radio" aria-checked="true">Risk split</button>
      </div>
    </div>
  </header>

  <!-- Attack lab: target panel (left) -->
  <section class="lab-only target" id="lab-target" aria-label="Mock target">
    <h2>Mock malicious target</h2>
    <label class="tf" for="lab-preset">Preset</label>
    <select id="lab-preset" aria-label="Target preset"></select>
    <label class="tf" for="lab-payload">Payload returned to the first agents</label>
    <textarea id="lab-payload" spellcheck="false" autocomplete="off" autocapitalize="off" rows="12" aria-describedby="lab-count"></textarea>
    <div class="count"><span id="lab-count">0 / 2000</span></div>
    <label class="tf" for="lab-token">Goal token</label>
    <input id="lab-token" type="text" spellcheck="false" autocomplete="off" autocapitalize="off" maxlength="48" aria-describedby="lab-hint">
    <p class="hint" id="lab-hint">Attack succeeds if an agent's output contains the goal token.</p>
    <p class="hint warn" id="lab-msg" role="status" aria-live="polite" hidden></p>
    <label class="tf" for="lab-backend">Backend</label>
    <select id="lab-backend" aria-label="LLM backend">
      <option value="groq">Groq (live)</option>
      <option value="stub">Offline stub</option>
    </select>
    <p class="hint warn" id="lab-backend-hint" role="status" hidden></p>
    <details class="adv" id="lab-adv">
      <summary>Advanced</summary>
      <label class="tf" for="lab-guard">Guard model</label>
      <select id="lab-guard" aria-label="Guard model">
        <option value="heuristic">Heuristic</option>
        <option value="sim">Simulation (30%)</option>
      </select>
      <label class="tf" for="lab-seed">Seed</label>
      <input id="lab-seed" type="number" min="0" max="1000000" value="0">
    </details>
  </section>

  <!-- Attack lab: controls above the stage -->
  <div class="lab-only labbar" id="lab-bar">
    <button type="button" class="defsw" id="lab-def" role="switch" aria-checked="false">Defence: <span id="lab-def-txt">off</span></button>
    <button type="button" class="runbtn" id="lab-run">Run attack</button>
    <button type="button" class="stopbtn" id="lab-stop" hidden>Stop</button>
    <span class="labinfo" id="lab-guards"></span>
    <p class="verdict" id="verdict" role="status" aria-live="polite"></p>
  </div>

  <main class="stage" id="stage">
    <svg id="svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated explainer stage"></svg>
    <div id="stage-msg" class="stage-msg" hidden></div>
  </main>

  <section class="caption algo-only" id="caption-bar">
    <p id="caption" role="status" aria-live="polite"></p>
  </section>

  <nav class="ctl algo-only" aria-label="Step controller">
    <div class="ctl-l">
      <button type="button" class="btn" id="btn-prev" aria-label="Previous step"><span class="ic" aria-hidden="true">&#9664;</span><span class="lbl">Prev</span></button>
      <button type="button" class="btn primary" id="btn-next" aria-label="Next step"><span class="lbl">Next</span><span class="ic" aria-hidden="true">&#9654;</span></button>
    </div>
    <span class="step-counter" id="step-counter">Step 0 / 12</span>
    <ol class="dots" id="dots" aria-label="Steps"></ol>
  </nav>

  <!-- Attack lab: log viewer below the stage -->
  <section class="lab-only logview" id="logview" aria-label="Agent output log viewer">
    <div class="lv-grip" id="lv-grip" role="separator" aria-orientation="horizontal" tabindex="0" aria-label="Resize the log viewer (drag, or use the up and down arrow keys)" title="Drag to resize"></div>
    <div class="lv-top">
      <h2>Agent output log viewer</h2>
      <div class="lv-ctl">
        <button type="button" class="tx" id="log-expand">[expand all]</button>
        <button type="button" class="tx" id="log-collapse">[collapse all]</button>
        <button type="button" class="tx" id="log-wrap" aria-pressed="false">[wrap: off]</button>
        <button type="button" class="tx" id="log-filter">[filter: all]</button>
        <button type="button" class="tx" id="log-save">[save .json]</button>
        <button type="button" class="tx" id="log-clear">[clear]</button>
      </div>
    </div>
    <div class="lv-body" id="log-body" role="log" tabindex="0" aria-label="Run output"></div>
  </section>

  <section class="strip" id="strip" aria-label="Settings">
    <label class="fld">Speed
      <input id="rng-speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="Animation speed">
      <output id="out-speed" for="rng-speed">1.0x</output>
    </label>
    <label class="tgl"><input type="checkbox" role="switch" id="tg-rm"><span class="sw" aria-hidden="true"></span>Reduce motion</label>
    <label class="tgl"><input type="checkbox" role="switch" id="tg-labels" checked><span class="sw" aria-hidden="true"></span>Show labels</label>
    <span class="sp"></span>
    <button type="button" class="btn sm algo-only" id="btn-reset">Reset step</button>
    <button type="button" class="btn sm algo-only" id="btn-restart">Restart</button>
  </section>

  <footer class="tabbar">
    <div class="tabs-l">
      <button type="button" class="btn sm btn-settings" id="btn-settings" aria-expanded="false" aria-controls="strip"><span aria-hidden="true">&#9881;</span> Settings</button>
    </div>
    <span class="keys algo-only">&#8592; &#8594; step &middot; Space next &middot; R reduce motion</span>
  </footer>
</div>

<script src="/static/vendor/d3.min.js"></script>
<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/vendor/MotionPathPlugin.min.js"></script>
<script src="/static/vendor/DrawSVGPlugin.min.js"></script>
<script src="/static/vendor/Flip.min.js"></script>
<script src="/static/js/util.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/stage-graph.js"></script>
<script src="/static/js/stage-bags.js"></script>
<script src="/static/js/stage-blast.js"></script>
<script src="/static/js/stage-budget.js"></script>
<script src="/static/js/logs.js"></script>
<script src="/static/js/live.js"></script>
<script src="/static/js/steps.js"></script>
<script src="/static/js/lab.js"></script>
<script src="/static/js/main.js"></script>
<script src="/static/replay/replay.js"></script>
</body>
</html>
