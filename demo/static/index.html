<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stopping a Prompt-Injection Worm in AI Agent Teams</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="app" id="app">

  <header class="hdr">
    <h1><span class="t-long">Stopping Prompt-Injection Worms</span><span class="t-short">Stopping Worms</span></h1>
    <div class="cfg" role="group" aria-label="Scenario">
      <label class="fld">Team
        <select id="sel-manifest" aria-label="Agent team (manifest)"></select>
      </label>
      <label class="fld">Budget B
        <input id="rng-budget" type="range" min="3" max="30" step="1" value="10" aria-label="Guard budget">
        <output id="out-budget" for="rng-budget">10</output>
      </label>
      <div class="seg" role="radiogroup" aria-label="Allocation">
        <button type="button" class="seg-btn" id="alloc-uniform" role="radio" aria-checked="false">Equal split</button>
        <button type="button" class="seg-btn on" id="alloc-risk" role="radio" aria-checked="true">Risk split</button>
      </div>
    </div>
    <div class="hdr-right">
      <span id="live-badge" class="live-badge" hidden></span>
      <span id="step-counter" class="step-counter">Step 0 / 14</span>
    </div>
  </header>

  <main class="stage" id="stage">
    <svg id="svg" viewBox="0 0 1600 640" preserveAspectRatio="xMidYMid meet" role="img" aria-label="Animated explainer stage"></svg>
    <div id="verdict" class="verdict" hidden></div>
    <div id="stage-msg" class="stage-msg" hidden></div>
  </main>

  <section class="caption" id="caption-bar">
    <p id="caption" role="status" aria-live="polite"></p>
  </section>

  <nav class="ctl" aria-label="Step controller">
    <div class="ctl-l">
      <button type="button" class="btn" id="btn-prev" aria-label="Previous step"><span class="ic" aria-hidden="true">&#9664;</span><span class="lbl">Prev</span></button>
      <button type="button" class="btn primary" id="btn-play" aria-label="Play"><span class="ic" aria-hidden="true">&#9654;</span><span class="lbl" id="play-label">Play</span></button>
      <button type="button" class="btn" id="btn-next" aria-label="Next step"><span class="lbl" id="next-label">Next</span><span class="ic" aria-hidden="true">&#9654;</span></button>
    </div>
    <ol class="dots" id="dots" aria-label="Steps"></ol>
    <div class="prog" id="prog">
      <span class="prog-txt" id="prog-txt">Step 0 / 14</span>
      <div class="prog-bar" id="prog-bar" role="slider" tabindex="0" aria-label="Step progress" aria-valuemin="0" aria-valuemax="14" aria-valuenow="0" aria-valuetext="Step 0 of 14"><div class="prog-fill" id="prog-fill"></div></div>
    </div>
    <div class="ctl-r" id="run-group" role="group" aria-label="Live runs">
      <button type="button" class="btn danger" id="btn-run-u"><span class="x-long">Run undefended</span><span class="x-short">Undefended</span></button>
      <button type="button" class="btn safe" id="btn-run-d"><span class="x-long">Run defended</span><span class="x-short">Defended</span></button>
      <button type="button" class="btn" id="btn-run-b"><span class="x-long">Run both</span><span class="x-short">Both</span></button>
    </div>
  </nav>

  <section class="strip" id="strip" aria-label="Settings">
    <label class="fld">Speed
      <input id="rng-speed" type="range" min="0.5" max="2" step="0.25" value="1" aria-label="Animation speed">
      <output id="out-speed" for="rng-speed">1.0x</output>
    </label>
    <label class="tgl"><input type="checkbox" role="switch" id="tg-rm"><span class="sw" aria-hidden="true"></span>Reduce motion</label>
    <label class="tgl"><input type="checkbox" role="switch" id="tg-labels" checked><span class="sw" aria-hidden="true"></span>Show labels</label>
    <label class="fld">Backend
      <select id="sel-backend" aria-label="LLM backend"><option value="stub" selected>stub</option><option value="groq">groq</option></select>
    </label>
    <label class="fld">Guards
      <select id="sel-guard" aria-label="Guard model"><option value="heuristic" selected>Heuristic</option><option value="sim">Simulation (30%)</option></select>
    </label>
    <label class="fld">Seed
      <input id="num-seed" type="number" min="0" max="1000000" value="0" aria-label="Random seed">
    </label>
    <label class="tgl"><input type="checkbox" role="switch" id="tg-clean"><span class="sw" aria-hidden="true"></span>Clean payload</label>
    <span class="sp"></span>
    <button type="button" class="btn sm" id="btn-reset">Reset step</button>
    <button type="button" class="btn sm" id="btn-restart">Restart</button>
  </section>

  <footer class="tabbar">
    <div class="tabs-l">
      <button type="button" class="logtab" id="btn-log" aria-expanded="false" aria-controls="drawer">
        <span class="ic" aria-hidden="true" id="log-ic">&#9650;</span> Logs <span class="cnt" id="log-count">0</span>
      </button>
      <button type="button" class="btn sm btn-settings" id="btn-settings" aria-expanded="false" aria-controls="strip"><span aria-hidden="true">&#9881;</span> Settings</button>
    </div>
    <span class="keys">&#8592; &#8594; step &middot; Space next &middot; P play &middot; L logs &middot; R reduce motion</span>
  </footer>

  <aside class="drawer" id="drawer" aria-label="Run logs" hidden>
    <div class="dr-top">
      <div class="tabs" role="tablist" aria-label="Log view">
        <button type="button" role="tab" class="tab" data-view="undefended" aria-selected="false">Undefended</button>
        <button type="button" role="tab" class="tab" data-view="defended" aria-selected="false">Defended</button>
        <button type="button" role="tab" class="tab on" data-view="both" aria-selected="true">Merged</button>
        <button type="button" role="tab" class="tab" data-view="side" aria-selected="false">Side by side</button>
      </div>
      <div class="lv" id="lv-chips" role="group" aria-label="Level filters"></div>
      <select id="log-src" aria-label="Source filter"><option value="">All sources</option></select>
      <input id="log-search" type="search" placeholder="Search messages" aria-label="Search log messages">
      <span class="lcount" id="log-shown">0 / 0</span>
      <label class="mini"><input type="checkbox" id="log-announce"> Announce</label>
      <button type="button" class="btn sm" id="log-dl">Download JSON</button>
      <button type="button" class="btn sm" id="log-clear">Clear</button>
      <button type="button" class="btn sm" id="log-close" aria-label="Close logs">&#10005;</button>
    </div>
    <div class="dr-body" id="log-body"></div>
    <button type="button" class="jump" id="log-jump" hidden>Jump to latest &#8595;</button>
  </aside>
</div>

<script src="/static/vendor/d3.min.js"></script>
<script src="/static/vendor/gsap.min.js"></script>
<script src="/static/vendor/MotionPathPlugin.min.js"></script>
<script src="/static/vendor/DrawSVGPlugin.min.js"></script>
<script src="/static/vendor/Flip.min.js"></script>
<script src="/static/js/util.js"></script>
<script src="/static/js/api.js"></script>
<script src="/static/js/state.js"></script>
<script src="/static/js/stage-graph.js"></script>
<script src="/static/js/stage-bags.js"></script>
<script src="/static/js/stage-blast.js"></script>
<script src="/static/js/stage-budget.js"></script>
<script src="/static/js/logs.js"></script>
<script src="/static/js/live.js"></script>
<script src="/static/js/steps.js"></script>
<script src="/static/js/main.js"></script>
<script src="/static/replay/replay.js"></script>
</body>
</html>
